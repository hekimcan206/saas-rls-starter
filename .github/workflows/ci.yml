name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Package versions are pinned and updated by hand, so a known vulnerability in any direct or
      # transitive package fails the build. Fix it with a pinned upgrade in Directory.Packages.props.
      - name: Audit for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      # Unit and property tests, then integration tests: PostgreSQL 17 and PgBouncer 1.25 start through
      # Testcontainers on the runner's Docker engine, PostgreSQL initialised with the same role script as compose.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*Tests*;-SaasRls.Benchmarks;-SaasRls.Demo"
          filefilters: "-*/obj/*"

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced."
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  container:
    name: container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: saas-rls-starter-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: samples/SaasRls.Demo/Dockerfile
          push: false
          load: true
          tags: saas-rls-starter-demo:ci
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo

      - name: Verify both images run as non-root
        run: |
          for image in saas-rls-starter-api:ci saas-rls-starter-demo:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            echo "$image user: ${user}"
            test -n "${user}" && test "${user}" != "0" && test "${user}" != "root"
          done

  compose-demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The README promises `docker compose up` runs the whole demo with zero manual steps; this job keeps it true.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Isolation holds and the pool pitfalls reproduce
        run: |
          code=$(docker wait saas-rls-starter-demo-1)
          docker compose logs --no-log-prefix demo | tee demo.log
          test "${code}" = "0"
          grep -q '"checks":16,"passed":16,"failures":\[\]' demo.log
          grep -q 'PASS  BROKEN: PgBouncer transaction mode hands A.s session SET to another client' demo.log
          grep -q 'PASS  FIXED: SET LOCAL through PgBouncer leaves nothing behind' demo.log

      - name: The API refuses to start as the table owner
        run: |
          set +e
          docker compose run --rm --no-deps \
            -e ConnectionStrings__App="Host=postgres;Database=saas;Username=saas_migrator;Password=migrator-dev-only" \
            api > owner.log 2>&1
          code=$?
          set -e
          cat owner.log | tail -5
          test "${code}" != "0"
          grep -q "Refusing to start" owner.log
          grep -q "TABLE_OWNED_BY_APP" owner.log

      - name: Logs on failure
        if: failure()
        run: docker compose logs
